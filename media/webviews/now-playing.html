<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicBee Remote</title>
  <link rel="stylesheet" href="{{cssUri}}" />
  <style nonce="{{nonce}}">
    :root {
      --mbrvsc-icon-play-track: url("{{playTrackUri}}");
      --mbrvsc-icon-pause-track: url("{{pauseTrackUri}}");
      --mbrvsc-icon-next-track: url("{{nextTrackUri}}");
      --mbrvsc-icon-previous-track: url("{{previousTrackUri}}");
      --mbrvsc-icon-repeat-0: url("{{repeat0Uri}}");
      --mbrvsc-icon-repeat-1: url("{{repeat1Uri}}");
      --mbrvsc-icon-repeat-2: url("{{repeat2Uri}}");
      --mbrvsc-icon-repeat: var(--mbrvsc-icon-repeat-0);
      --mbrvsc-icon-shuffle-0: url("{{shuffle0Uri}}");
      --mbrvsc-icon-shuffle-1: url("{{shuffle1Uri}}");
      --mbrvsc-icon-shuffle-2: url("{{shuffle2Uri}}");
      --mbrvsc-icon-shuffle: var(--mbrvsc-icon-shuffle-0);
      --mbrvsc-icon-volume-0: url("{{volume0Uri}}");
      --mbrvsc-icon-volume-1: url("{{volume1Uri}}");
      --mbrvsc-icon-volume-2: url("{{volume2Uri}}");
      --mbrvsc-icon-volume-3: url("{{volume3Uri}}");
      --mbrvsc-icon-volume-4: url("{{volume4Uri}}");
      --mbrvsc-icon-volume: var(--mbrvsc-icon-volume-3);
    }

    #btnRepeat,
    #btnShuffle {
      min-width: 24px;
      min-height: 24px;
      padding: 2px;
      line-height: 1;
    }

    #btnRepeat .control-icon,
    #btnShuffle .control-icon {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      vertical-align: middle;
      background-color: currentColor;
      mask-position: center;
      mask-repeat: no-repeat;
      mask-size: contain;
      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: contain;
    }

    #btnRepeat .control-icon {
      mask-image: var(--mbrvsc-icon-repeat);
      -webkit-mask-image: var(--mbrvsc-icon-repeat);
    }

    #btnShuffle .control-icon {
      mask-image: var(--mbrvsc-icon-shuffle);
      -webkit-mask-image: var(--mbrvsc-icon-shuffle);
    }
  </style>
</head>
<body data-mbr-theme="{{theme}}" data-icon-play-track="{{playTrackUri}}" data-icon-pause-track="{{pauseTrackUri}}" data-icon-next-track="{{nextTrackUri}}" data-icon-previous-track="{{previousTrackUri}}" data-icon-repeat-0="{{repeat0Uri}}" data-icon-repeat-1="{{repeat1Uri}}" data-icon-repeat-2="{{repeat2Uri}}" data-icon-shuffle-0="{{shuffle0Uri}}" data-icon-shuffle-1="{{shuffle1Uri}}" data-icon-shuffle-2="{{shuffle2Uri}}" data-icon-volume-0="{{volume0Uri}}" data-icon-volume-1="{{volume1Uri}}" data-icon-volume-2="{{volume2Uri}}" data-icon-volume-3="{{volume3Uri}}" data-icon-volume-4="{{volume4Uri}}">
  <div class="cover" id="cover" data-no-art="{{noArtUri}}">
    <button id="btnFavorite" class="secondary favorite" data-control="favorite">&#10084;</button>
    <div class="album-art" id="albumArt"></div>
  </div>
  <div class="track-meta">
    <div class="track-title" id="title">Nothing playing</div>
    <div class="track-sub" id="artist">&mdash;</div>
    <div class="track-sub" id="album"></div>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progress"></div>
  </div>
  <div class="progress-labels">
    <span id="posCurrent">0:00</span>
    <span id="posTotal">0:00</span>
  </div>
  <div class="controls">
    <div class="control-row primary-controls">
      <div class="group center">
        <button class="secondary big media-control" data-control="previous" aria-label="Previous track">
          <span class="control-icon control-icon--previous" aria-hidden="true"></span>
        </button>
        <button id="btnPlayPause" class="big primary media-control" data-control="playPause" data-state="paused" aria-label="Play">
          <span class="control-icon control-icon--playpause" aria-hidden="true"></span>
        </button>
        <button class="secondary big media-control" data-control="next" aria-label="Next track">
          <span class="control-icon control-icon--next" aria-hidden="true"></span>
        </button>
      </div>

      <div class="group right">

      </div>
    </div>

    <div class="control-row secondary-controls">
      <div class="group left">
        <button id="btnMute" class="secondary volume-control" data-control="mute" aria-label="Mute"></button>
        <input id="volume" type="range" min="0" max="100" value="50" />
      </div>

      <div class="group right">
        <div class="rating" id="rating">
          <span class="star" data-index="0">
            <span class="star-bg">★</span>
            <span class="star-fill">★</span>
          </span>
          <span class="star" data-index="1">
            <span class="star-bg">★</span>
            <span class="star-fill">★</span>
          </span>
          <span class="star" data-index="2">
            <span class="star-bg">★</span>
            <span class="star-fill">★</span>
          </span>
          <span class="star" data-index="3">
            <span class="star-bg">★</span>
            <span class="star-fill">★</span>
          </span>
          <span class="star" data-index="4">
            <span class="star-bg">★</span>
            <span class="star-fill">★</span>
          </span>
        </div>
      </div>

      <div class="group right">
        <button id="btnRepeat" class="secondary toggle-control" data-control="repeat" data-state="off" aria-label="Repeat off">
          <span class="control-icon control-icon--repeat" aria-hidden="true"></span>
        </button>
        <button id="btnShuffle" class="secondary toggle-control" data-control="shuffle" data-state="off" aria-label="Shuffle off">
          <span class="control-icon control-icon--shuffle" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>
  <div class="asset-preload" aria-hidden="true">
    <img src="{{repeat0Uri}}" alt="" />
    <img src="{{repeat1Uri}}" alt="" />
    <img src="{{repeat2Uri}}" alt="" />
    <img src="{{shuffle0Uri}}" alt="" />
    <img src="{{shuffle1Uri}}" alt="" />
    <img src="{{shuffle2Uri}}" alt="" />
    <img src="{{volume0Uri}}" alt="" />
    <img src="{{volume1Uri}}" alt="" />
    <img src="{{volume2Uri}}" alt="" />
    <img src="{{volume3Uri}}" alt="" />
    <img src="{{volume4Uri}}" alt="" />
  </div>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
