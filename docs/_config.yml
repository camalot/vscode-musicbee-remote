---
remote_theme: just-the-docs/just-the-docs

title: MusicBee Remote
description: A Visual Studio Code extension to control MusicBee remotely.
url: "https://camalot.github.io"
baseurl: "/vscode-musicbee-remote"
logo: /assets/images/musicbee.svg

github_username: camalot
github_repo: vscode-musicbee-remote

# Build settings
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - rouge

highlighter: rouge

# kramdown:
#   input: GFM
#   syntax_highlighter: rouge

# Theme configuration

search_enabled: true
search:
  heading_level: 2
  previews: 3

nav_sort: case_insensitive

color_scheme: dracula

# Aux links (top nav)
aux_links:
  "Marketplace":
    - "https://marketplace.visualstudio.com/items?itemName=darthminos.musicbee-remote"
  "Open VSX":
    - "https://open-vsx.org/extension/darthminos/musicbee-remote"
  "GitHub":
    - "https://github.com/camalot/vscode-musicbee-remote"

aux_links_new_tab: true

# Back to top link — replaced by custom FAB button (see _includes/footer_custom.html)
back_to_top: false

# Suppress Sass deprecation warnings from just-the-docs theme (darken/lighten, @import, etc.)
sass:
  silence_deprecations:
    - color-functions
    - import
    - global-builtin

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  tip:
    title: Tip
    color: blue
  warning:
    title: Warning
    color: yellow
  caution:
    title: Caution
    color: red

# Exclude from build
exclude:
  - _plans/
  - Gemfile
  - Gemfile.lock
  - node_modules/
